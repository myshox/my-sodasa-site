                var redirect = searchParams.get('redirect');
                if (redirect && redirect !== '/' && redirect.startsWith('/')) {
                    navigate(redirect, { replace: true });
                }
            }, []);

            useEffect(() => {
                document.documentElement.classList.toggle('accessibility-large', largeMode);
                localStorage.setItem(LARGE_MODE_KEY, largeMode ? '1' : '0');
            }, [largeMode]);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                setTimeout(() => setIsLoading(false), 1500);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);
            
            // 檢查舊有贊助者是否需要補綁定主帳號
            const checkBindingRequired = async (u) => {
                if (!u) return;
                if (u.user_metadata?.game_master) return; // 已綁定，不需要
                // 查詢此帳號是否有過往捐款紀錄
                try {
                    const { data, error } = await supabase
                        .from('donations')
                        .select('id')
                        .eq('user_id', u.id)
                        .limit(1);
                    if (!error && data && data.length > 0) {
                        setBindingModal(true); // 有捐款但沒主帳號 → 強制彈窗
                    }
                } catch (e) { /* 查詢失敗靜默 */ }
            };

            useEffect(() => {
                // 監聽成功綁定事件，關閉強制彈窗
                const onBound = () => setBindingModal(false);
                window.addEventListener('game-master-bound', onBound);
                return () => window.removeEventListener('game-master-bound', onBound);
            }, []);

            useEffect(() => {
                // 檢查當前用戶
                authHelpers.getCurrentUser().then(u => {
                    setUser(u);
                    checkBindingRequired(u);
                });
                
                // 監聽認證狀態變化
                const { data } = authHelpers.onAuthStateChange((event, session) => {
                    const u = session?.user ?? null;
                    setUser(u);
                    if (event === 'SIGNED_IN') checkBindingRequired(u);
                    if (event === 'SIGNED_OUT') setBindingModal(false);
                });
                
                return () => {
                    if (data?.subscription) {
                        data.subscription.unsubscribe();
                    }
                };
            }, []);

            useEffect(() => {
                if (typeof window.sodasaFbq !== 'function') return;
                const p = location.pathname;
                window.sodasaFbq('PageView');
                const names = { '/recharge': '金幣贊助', '/download': '下載遊戲', '/auth': '登入註冊', '/guides': '活動攻略', '/events': '最新活動', '/support': '官方客服' };
                const name = names[p] || (p.startsWith('/guides/') ? '攻略內文' : null);
                if (name) window.sodasaFbq('ViewContent', { content_name: name });
            }, [location.pathname]);

            return (
                <div className="min-h-screen flex flex-col font-sans pb-20 md:pb-0 text-stone-800 relative">
                    <a href="#main-content" className="skip-link">跳過至主內容</a>
                    <AnimatePresence>
                        {isLoading && <LoadingScreen key="loader" />}
                    </AnimatePresence>

                    <ToastContainer />
                    <GlobalRealtimeSync />

                    {/* 強制補綁主帳號彈窗（有過往捐款但未綁定者） */}
                    {bindingModal && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-stone-900/80 backdrop-blur-md">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden border-2 border-red-300">
                                <div className="bg-gradient-to-r from-red-500 to-orange-500 px-6 py-5 flex items-center gap-4">
                                    <div className="w-12 h-12 rounded-2xl bg-white/20 flex items-center justify-center shrink-0">
                                        <AlertCircle size={28} className="text-white" />
                                    </div>
                                    <div>
                                        <h2 className="text-xl font-black text-white">帳號綁定未完成</h2>
                                        <p className="text-red-100 text-sm mt-0.5">您有過往儲值紀錄，需補充綁定</p>
                                    </div>
                                </div>
                                <div className="p-6 space-y-4">
                                    <div className="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 text-stone-700 text-sm space-y-2 font-medium">
                                        <p className="font-black text-stone-800 text-base">📋 為什麼需要綁定？</p>
                                        <p>• 系統偵測到您有儲值紀錄，但尚未設定遊戲主帳號</p>
                                        <p>• 綁定後，管理員才能正確將金幣發放到您的帳號</p>
                                        <p>• 未綁定將導致<strong className="text-red-600">無法確認您的身份</strong>，影響後續儲值與客服處理</p>
                                    </div>
                                    <div className="bg-sky-50 border border-sky-200 rounded-xl p-3 text-sky-700 text-xs font-medium">
                                        💡 遊戲主帳號是您登入遊戲的帳號（非角色名稱），請確認輸入正確後查詢驗證
                                    </div>
                                    <button
                                        onClick={() => { setBindingModal(false); navigate('/member'); }}
                                        className="flex items-center justify-center gap-3 w-full py-4 bg-gradient-to-r from-red-500 to-orange-500 hover:from-red-600 hover:to-orange-600 text-white font-black text-base rounded-2xl transition-all shadow-lg"
                                    >
                                        <User size={20} />
                                        立即前往會員中心完成綁定
                                        <ArrowRight size={20} />
                                    </button>
                                    <p className="text-center text-stone-400 text-xs">此提示在您完成綁定前將持續出現</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 右下角活動浮動按鈕 */}
                    <FloatingActivityButton />

                    {/* 大字模式切換（中高齡友善） */}
                    <button
                        onClick={() => setLargeMode(v => !v)}
                        className={`fixed z-40 right-4 bottom-24 md:bottom-6 flex items-center justify-center w-12 h-12 rounded-full shadow-lg border-2 transition-all min-h-[48px] min-w-[48px] ${largeMode ? 'bg-gold-500 text-white border-gold-600' : 'bg-white/90 text-stone-600 border-stone-200 hover:bg-stone-50'}`}
                        title={largeMode ? '切換一般模式' : '大字模式（字體放大、按鈕加大）'}
                        aria-label={largeMode ? '切換一般模式' : '大字模式'}
                    >
                        <Type size={22} strokeWidth={2.5} />
                    </button>

                    <ScrollToTop />
                    <PageTitle />
                    <nav className={`fixed top-0 w-full z-50 py-3 ${isScrolled ? 'neu-nav-bg' : ''}`}>
                        <div className="max-w-7xl mx-auto px-4 md:px-6 flex justify-between items-center">
                            <Link to="/" className="flex items-center gap-4 min-h-[44px] min-w-[44px] md:min-w-0">
                                <div className="h-10 md:h-12 w-auto overflow-visible drop-shadow-sm">
                                    <SmartImage src={getAssetUrl(ASSETS.LOGO)} fallbackType="logo" className="h-full w-auto object-contain" alt="蘇打石器" />
                                </div>
                            </Link>

                            <div className="hidden lg:flex items-center gap-2 px-3 py-2 rounded-2xl neu-raised">
                                {['部落首頁', '活動攻略', '遊戲下載', '金幣贊助', '官方客服'].map((label, i) => {
                                    const path = i === 0 ? '/' : i === 1 ? '/guides' : i === 2 ? '/download' : i === 3 ? '/recharge' : '/support';
                                    const isActive = location.pathname === path;
                                    return (
                                        <Link key={path} to={path} className="rounded-xl">
                                            <div className={`px-4 py-2.5 rounded-xl text-sm font-bold ${isActive ? 'neu-item-active text-stone-800' : 'neu-item text-stone-600'}`}>
                                                {label}
                                            </div>
                                        </Link>
                                    );
                                })}
                                <Link key="events" to="/events" className="rounded-xl">
                                    <div className={`px-4 py-2.5 rounded-xl text-sm font-bold ${location.pathname === '/events' ? 'neu-item-active text-stone-800' : 'neu-item text-stone-600'}`}>
                                        最新活動
                                    </div>
                                </Link>
                            </div>

                            <div className="flex items-center gap-2 md:gap-3">
                                <MusicPlayer />
                                
                                {user ? (
                                    <Link to="/member" className="hidden lg:flex items-center gap-2 px-3 py-2 text-stone-700 neu-item rounded-xl font-bold text-sm" title="會員中心">
                                        <User className="w-4 h-4" />
                                        <span className="hidden xl:inline">會員中心</span>
                                    </Link>
                                ) : (
                                    <Link to="/auth" className="hidden lg:flex items-center gap-2 px-3 py-2 text-white rounded-xl font-bold text-sm shadow-lg" style={{ background: 'linear-gradient(135deg, #d4a84b 0%, #c4953a 100%)', boxShadow: '6px 6px 12px rgba(139,90,43,0.3), -2px -2px 6px rgba(255,255,255,0.2)' }} title="登入/註冊">
                                        <User className="w-4 h-4" />
                                        <span className="hidden xl:inline">登入</span>
                                    </Link>
                                )}
                                
                                {(user?.user_metadata?.role === 'admin' || user?.user_metadata?.role === 'super_admin') && (
                                    <Link to="/admin" className="hidden lg:flex items-center gap-2 px-3 py-2 rounded-xl font-bold text-sm" title="後台管理">
                                        <div className={`flex items-center gap-2 px-3 py-2 rounded-xl ${location.pathname === '/admin' ? 'text-white' : 'neu-item text-orange-700'}`} style={location.pathname === '/admin' ? { background: 'linear-gradient(135deg, #d4a84b, #c47819)', boxShadow: 'inset 2px 2px 4px rgba(255,255,255,0.2), inset -2px -2px 4px rgba(0,0,0,0.1)' } : {}}>
                                            <Settings className="w-4 h-4" />
                                            <span className="hidden xl:inline">後台管理</span>
                                        </div>
                                    </Link>
                                )}
                            </div>
                        </div>
                    </nav>

                    <MobileBottomNav />

                    <main id="main-content" className="flex-grow" tabIndex={-1}>
                        <AnimatePresence mode="wait">
                            <Routes location={location} key={location.pathname}>
                                <Route path="/" element={<HomePage />} />
                                <Route path="/auth" element={<AuthPage />} />
                                <Route path="/member" element={<MemberPage />} />
                                <Route path="/recharge" element={<RechargePage />} />
                                <Route path="/support" element={<SupportPage />} />
                                <Route path="/terms" element={<TermsPage />} />
                                <Route path="/download" element={<DownloadPage />} />
                                <Route path="/guides/:id" element={<GuidesPage />} />
                                <Route path="/guides" element={<GuidesPage />} />
                                <Route path="/events" element={<EventsPage />} />
                                <Route path="/admin" element={<AdminPage />} />
                                <Route path="*" element={<NotFoundPage />} />
                            </Routes>
                        </AnimatePresence>
                    </main>

                    <footer className="bg-stone-900 py-12 md:py-16 px-6 border-t-4 border-wood-600 mt-auto relative z-10 text-stone-400 mb-20 md:mb-0">
                        <div className="max-w-7xl mx-auto space-y-8">
                            {/* 免責聲明區塊 */}
                            <div className="bg-stone-800/50 rounded-2xl p-6 md:p-8 border border-stone-700">
                                <h3 className="text-gold-400 font-black text-lg mb-4 flex items-center gap-2">
                                    <AlertCircle size={20} />
                                    免責聲明
                                </h3>
                                <div className="space-y-3 text-stone-400 text-sm leading-relaxed">
                                    <p>
                                        <strong className="text-stone-300">⚠️ 本伺服器為非營利性質的粉絲私人伺服器</strong>，與原廠公司無任何關聯。
                                        僅供玩家娛樂交流，為維持伺服器運作接受玩家自願贊助。
                                    </p>
                                    <p>
                                        • 玩家贊助為<strong className="text-red-400">自願行為</strong>，一經完成<strong className="text-red-400">恕不接受退款或換貨</strong>
                                    </p>
                                    <p>
                                        • 虛擬物品回饋<strong className="text-gold-400">僅限遊戲內使用</strong>，不具實際價值，無法兌換現金
                                    </p>
                                    <p>
                                        • 本服務可能因維護、更新、不可抗力等因素中斷，對於服務中斷造成的損失，<strong className="text-red-400">本服務不負賠償責任</strong>
                                    </p>
                                </div>
                                <div className="mt-4 pt-4 border-t border-stone-700">
                                    <Link 
                                        to="/terms" 
                                        className="inline-flex items-center gap-2 text-gold-400 hover:text-gold-300 font-bold text-sm transition-colors"
                                    >
                                        <ScrollText size={16} />
                                        查看完整服務條款
                                        <ArrowRight size={14} />
                                    </Link>
                                </div>
                            </div>

                            {/* 頁尾資訊 */}
                            <div className="flex flex-col md:flex-row justify-between items-center gap-6 pt-6 border-t border-stone-800">
                                <div className="flex items-center gap-5 opacity-90">
                                    <div className="h-9 md:h-10 w-auto overflow-hidden grayscale hover:grayscale-0 transition-all duration-300">
                                        <SmartImage src={getAssetUrl(ASSETS.LOGO)} fallbackType="logo" className="h-full w-auto object-contain brightness-0 invert" alt="蘇打石器" />
                                    </div>
                                    <span className="font-bold text-sm tracking-widest border-l border-stone-600 pl-5 h-8 flex items-center">SODA STONE AGE</span>
                                </div>
                                <div className="flex flex-col md:flex-row items-center gap-4 md:gap-6 text-xs">
                                    <Link to="/download" className="hover:text-gold-400 transition-colors font-bold">遊戲下載</Link>
                                    <Link to="/support" className="hover:text-gold-400 transition-colors font-bold">官方客服</Link>
                                    <Link to="/terms" className="hover:text-gold-400 transition-colors font-bold">服務條款</Link>
                                    <p className="font-mono tracking-wide opacity-60">© 2026 Fan-made Project</p>
                                </div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const App = () => {
            return <Layout />;
        };

        const root = createRoot(document.getElementById('root'));
        root.render(
            <HashRouter>
                <App />
            </HashRouter>
        );
    </script>

    <!-- Structured Data (JSON-LD) for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "蘇打石器",
      "alternateName": "Soda Stone Age",
      "description": "經典石器時代 2.5 版本私服，完美復刻原汁原味，純淨遊戲環境，長久穩定經營",
      "genre": ["MMORPG", "角色扮演", "多人線上遊戲"],
      "gamePlatform": "PC",
      "operatingSystem": "Windows",
      "applicationCategory": "Game",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "TWD",

    </script>

    <!-- Service Worker Registration for PWA -->
    <script>
        // Register Service Worker for PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('✅ Service Worker registered:', registration.scope);
                    })
                    .catch(error => {
                        console.log('❌ Service Worker registration failed:', error);
                    });
            });
        }

        // PWA Install Prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Optional: Show custom install button
            console.log('💡 PWA can be installed');
        });

        // Track PWA installation
        window.addEventListener('appinstalled', () => {
            console.log('✅ PWA installed successfully');
            deferredPrompt = null;
        });
    </script>

    <!-- Performance Monitoring -->
    <script>
        // Log page load performance
        window.addEventListener('load', () => {
            if (window.performance) {
                const perfData = window.performance.timing;
                const pageLoadTime = perfData.loadEventEnd - perfData.navigationStart;
                const connectTime = perfData.responseEnd - perfData.requestStart;
                console.log(`📊 Page Load: ${pageLoadTime}ms, Server Response: ${connectTime}ms`);
            }
        });
    </script>
</body>
