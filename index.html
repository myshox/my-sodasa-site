            const doFetch = (attempt) => {
                const fetchOpts = attempt > 0 ? { ...opts, signal: undefined } : opts;
                return fetch(url, fetchOpts).catch((err) => {
                    const isAbort = err?.name === 'AbortError' || String(err?.message || '').includes('aborted');
                    if (isAbort && attempt < 2) {
                        const delay = (attempt + 1) * 2500;
                        return new Promise(r => setTimeout(r, delay)).then(() => doFetch(attempt + 1));
                    }
                    throw err;
                });
            };
            return doFetch(0);

        const GlobalRealtimeSync = () => {

                    return;

                    const { error } = await supabase.auth.updateUser({

                        setError(error.message);

                    setError('發生錯誤，請稍後再試');

                    setLoading(false);
                }

                    return;

                        setError('請填寫遊戲帳號');
                        return;
                    }
                    if (password !== confirmPassword) {
                        setError('密碼不一致');
                        return;
                    }
                    if (!agreeTerms) {
                        setError('請閱讀並同意服務條款');
                        return;
                    }
                }
                
                if (password.length < 6) {
                    setError('密碼至少需要 6 個字元');
                    return;
                }
                
                setLoading(true);

                    if (isLogin) {
                        const { error } = await authHelpers.signIn(email, password);

                            const msg = error.message || '';

                            if (msg.includes('Email not confirmed')) errText = '請先到信箱點擊驗證連結';
                            else if (msg.includes('fetch') || msg.includes('network') || msg.includes('Failed to fetch')) errText = '網路連線失敗，請檢查網路或稍後再試';
                            setError(errText);
                        } else {
                            // 處理記住帳號密碼
                            if (rememberMe) {
                                localStorage.setItem('rememberedEmail', email);
                                localStorage.setItem('rememberedPassword', btoa(password)); // 簡單編碼（非安全加密）

                                localStorage.removeItem('rememberedPassword');
                            }

                            navigate('/member');

                                    <button 
                                        onClick={() => setShowTermsModal(false)}

                                    </button>
                                </div>

                                <div className="space-y-6 text-stone-700 text-sm leading-relaxed">

                                            <li className="text-red-600 font-bold">• 本伺服器為非營利性質，接受玩家自願贊助以維持運作</li>
                                            <li className="text-red-600 font-bold">• 贊助為自願行為，一經贊助恕不退款或換貨</li>
                                            <li>• 虛寶由管理員人工審核後發放，非即時到帳</li>
                                        </ul>
                                    </div>

                                    <div>

                                            <li>• 帳號密碼請妥善保管，不得轉讓或出借他人</li>
                                            <li>• 一個 Email 最多可註冊 5 個遊戲帳號</li>
                                        </ul>
                                    </div>

                                            <li className="font-bold text-red-600">• 禁止利用遊戲漏洞進行不當獲利</li>
                                            <li className="font-bold text-red-600">• 禁止進行遊戲幣、虛寶的真實金錢交易</li>

                            <p className="text-stone-500 text-center mb-8">

                                            <span className="text-fire-700 font-bold text-sm">{error}</span>

                                    <div>

                                        variant="gold"
                                        className="w-full py-4 text-lg"
                                        disabled={loading}

                                        <span>{loading ? '更新中...' : '更新密碼'}</span>

                                    <div className="text-center mt-6">

                            </div>
                            <div className="flex items-center gap-1 bg-stone-100 p-1 rounded-2xl shrink-0">
                                {[{ m: 'grid', icon: LayoutGrid, t: '卡片' }, { m: 'list', icon: List, t: '條列' }].map(({ m, icon: Icon, t }) => (
                                    <button key={m} onClick={() => handleViewModeChange(m)}
                                        className={`px-5 py-3 rounded-xl font-bold text-base flex items-center gap-2 transition-all min-h-[48px] ${viewMode === m ? 'bg-white text-stone-800 shadow-md' : 'text-stone-500 hover:text-stone-700'}`}>
                                        <Icon size={18} />{t}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 分類篩選 */}
                        <div className="flex flex-wrap gap-2.5 mb-10">
                            <button
                                onClick={() => setCategory('all')}
                                className={`px-5 py-2.5 rounded-2xl text-base font-bold transition-all min-h-[48px] ${category === 'all' ? 'bg-stone-800 text-white shadow-md' : 'bg-white border-2 border-stone-200 text-stone-600 hover:bg-stone-50 hover:border-stone-300'}`}
                            >
                                📚 全部
                                {!loading && guides.length > 0 && <span className="ml-2 text-sm opacity-60">({guides.length})</span>}
                            </button>
                            {Object.entries(GUIDE_CATEGORIES).map(([id, c]) => {
                                const count = guides.filter(g => g.category === id).length;
                                if (count === 0 && !loading) return null;
                                return (
                                    <button
                                        key={id}
                                        onClick={() => setCategory(id)}
                                        className={`px-5 py-2.5 rounded-2xl text-base font-bold transition-all min-h-[48px] ${category === id ? 'bg-stone-800 text-white shadow-md' : 'bg-white border-2 border-stone-200 text-stone-600 hover:bg-stone-50 hover:border-stone-300'}`}
                                    >
                                        {c.icon} {c.label}
                                        {!loading && <span className="ml-2 text-sm opacity-60">({count})</span>}
                                    </button>
                                );
                            })}
                        </div>

                        {/* 內容 */}
                        {loading ? (
                            <LoadingSpinner message="載入攻略中..." />
                        ) : guides.length === 0 ? (
                            <div className="stone-panel text-center py-20 bg-white">
                                <BookOpen size={56} className="mx-auto text-stone-300 mb-5" />
                                <p className="text-stone-700 font-black text-2xl mb-2">目前沒有攻略</p>
                                <p className="text-stone-500 text-base">敬請期待精彩內容！</p>
                            </div>
                        ) : filteredGuides.length === 0 ? (
                            <div className="stone-panel text-center py-16 bg-white">
                                <Search size={48} className="mx-auto text-stone-300 mb-4" />
                                <p className="text-stone-700 font-bold text-xl mb-2">查無符合「{searchTerm}」的攻略</p>
                                <p className="text-stone-500">請嘗試其他關鍵字</p>
                            </div>
                        ) : (
                            <div className="space-y-10">
                                {/* 置頂精選 */}
                                {showPinSection && (
                                    <div>
                                        <h2 className="flex items-center gap-2.5 text-2xl font-black text-stone-800 mb-5">
                                            <Star size={22} fill="currentColor" className="text-amber-500" /> 精選置頂
                                        </h2>
                                        {viewMode === 'grid' ? (
                                            <div className="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                                {pinnedGuides.map(g => <GuideCard key={g.id} guide={g} onClick={() => handleGuideClick(g)} />)}
                                            </div>
                                        ) : (
                                            <div className="space-y-4">
                                                {pinnedGuides.map(g => <GuideListItem key={g.id} guide={g} onClick={() => handleGuideClick(g)} />)}
                                            </div>
                                        )}
                                    </div>
                                )}
                                {/* 一般攻略 */}
                                {(showPinSection ? normalGuides : filteredGuides).length > 0 && (
                                    <div>
                                        {showPinSection && normalGuides.length > 0 && (
                                            <h2 className="flex items-center gap-2.5 text-2xl font-black text-stone-800 mb-5">
                                                <BookOpen size={22} className="text-stone-600" /> 所有攻略
                                            </h2>
                                        )}
                                        {viewMode === 'grid' ? (
                                            <div className="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                                {(showPinSection ? normalGuides : filteredGuides).map(g => <GuideCard key={g.id} guide={g} onClick={() => handleGuideClick(g)} />)}
                                            </div>
                                        ) : (
                                            <div className="space-y-4">
                                                {(showPinSection ? normalGuides : filteredGuides).map(g => <GuideListItem key={g.id} guide={g} onClick={() => handleGuideClick(g)} />)}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </motion.div>
            );
        };

        // 富文本編輯器組件（Quill.js）
        const GuideEditor = ({ guide, currentUser, onClose }) => {
            const [title, setTitle] = useState(guide?.title || '');
            const [authorName, setAuthorName] = useState(guide?.author_name || '管理員');
            const [category, setCategory] = useState(guide?.category || 'general');
            const [status, setStatus] = useState(guide?.status || 'published');
            const [isPinned, setIsPinned] = useState(guide?.is_pinned || false);
            const [saving, setSaving] = useState(false);
            const quillRef = useRef(null);
            const editorRef = useRef(null);
            const lastExcelHtmlRef = useRef(null);

            useEffect(() => {
                if (!editorRef.current && quillRef.current && window.Quill) {
                    if (!window.__excelTableBlotRegistered) {
                        var BlockEmbed = window.Quill.import('blots/block/embed');
                        class ExcelTableBlot extends BlockEmbed {
                            static create(value) {
                                var node = super.create();
                                node.setAttribute('contenteditable', 'false');
                                node.classList.add('guide-excel-table');
                                node.innerHTML = value || '';
                                return node;
                            }
                            static value(node) { return node.innerHTML; }
                        }
                        ExcelTableBlot.blotName = 'excelTable';
                        ExcelTableBlot.tagName = 'div';
                        window.Quill.register(ExcelTableBlot);
                        window.__excelTableBlotRegistered = true;
                    }
                    const quill = new window.Quill(quillRef.current, {
                        theme: 'snow',
                        modules: {
                            toolbar: [
                                [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                                ['bold', 'italic', 'underline', 'strike'],
                                [{ 'color': [] }, { 'background': [] }],
                                [{ 'align': [] }],
                                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                                ['blockquote', 'code-block'],
                                ['link', 'image'],
                                ['clean']
                            ]
                        },
                        placeholder: '在此貼上您的內容...\n支援從 Word 直接複製貼上（Ctrl+V）'
                    });

                    if (guide?.content) {
                        quill.setSelection(0);
                        quill.deleteText(0, quill.getLength());
                        if (guide.content.includes('<table')) {
                            quill.root.innerHTML = guide.content;
                        } else {
                            quill.clipboard.dangerouslyPasteHTML(0, guide.content);
                        }
                    }

                    quill.getModule('toolbar').addHandler('image', () => {
                        const input = document.createElement('input');
                        input.setAttribute('type', 'file');
                        input.setAttribute('accept', 'image/*');
                        input.click();

                        input.onchange = async () => {
                            const file = input.files[0];
                            if (!file) return;
                            const maxW = 1200;
                            const quality = 0.82;
                            const isPng = file.type === 'image/png';
                            const compressImage = (blob) => new Promise((resolve) => {
                                const img = new Image();
                                const url = URL.createObjectURL(blob);
                                img.onload = () => {
                                    URL.revokeObjectURL(url);
                                    if (img.width <= maxW && file.size < 250000) {
                                        resolve(blob);
                                        return;
                                    }
                                    const c = document.createElement('canvas');
                                    const scale = Math.min(1, maxW / img.width);
                                    c.width = Math.round(img.width * scale);
                                    c.height = Math.round(img.height * scale);
                                    const ctx = c.getContext('2d');
                                    ctx.drawImage(img, 0, 0, c.width, c.height);
                                    const mime = isPng ? 'image/png' : 'image/jpeg';
                                    c.toBlob((b) => resolve(b || blob), mime, isPng ? 0.9 : quality);
                                };
                                img.onerror = () => { URL.revokeObjectURL(url); resolve(blob); };
                                img.src = url;
                            });
                            try {
                                const compressed = await compressImage(file);
                                const reader = new FileReader();
                                reader.onload = (e) => {
                                    const range = quill.getSelection();
                                    quill.insertEmbed(range?.index ?? 0, 'image', e.target.result);
                                };
                                reader.readAsDataURL(compressed);
                            } catch (err) {
                                const reader = new FileReader();
                                reader.onload = (e) => {
                                    const range = quill.getSelection();
                                    quill.insertEmbed(range?.index ?? 0, 'image', e.target.result);
                                };
                                reader.readAsDataURL(file);
                            }
                        };
                    });

                    quill.root.addEventListener('paste', async (e) => {
                        const cd = e.clipboardData;
                        if (!cd) return;
                        for (let i = 0; i < cd.items.length; i++) {
                            const item = cd.items[i];
                            if (item.type.indexOf('image') !== 0) continue;
                            e.preventDefault();
                            const file = item.getAsFile();
                            if (!file) return;
                            const maxW = 1200, quality = 0.82;
                            const compressBlob = (blob) => new Promise((resolve) => {
                                const img = new Image();
                                const url = URL.createObjectURL(blob);
                                img.onload = () => {
                                    URL.revokeObjectURL(url);
                                    if (img.width <= maxW && blob.size < 250000) return resolve(blob);
                                    const c = document.createElement('canvas');
                                    const scale = Math.min(1, maxW / img.width);
                                    c.width = Math.round(img.width * scale);
                                    c.height = Math.round(img.height * scale);
                                    const ctx = c.getContext('2d');
                                    ctx.drawImage(img, 0, 0, c.width, c.height);
                                    c.toBlob((b) => resolve(b || blob), 'image/jpeg', quality);
                                };
                                img.onerror = () => { URL.revokeObjectURL(url); resolve(blob); };
                                img.src = url;
                            });
                            try {
                                const compressed = await compressBlob(file);
                                const reader = new FileReader();
                                reader.onload = (ev) => {
                                    const idx = quill.getSelection(true)?.index ?? quill.getLength();
                                    quill.insertEmbed(idx, 'image', ev.target.result);
                                };
                                reader.readAsDataURL(compressed);
                            } catch (err) {
                                const reader = new FileReader();
                                reader.onload = (ev) => {
                                    const idx = quill.getSelection(true)?.index ?? quill.getLength();
                                    quill.insertEmbed(idx, 'image', ev.target.result);
                                };
                                reader.readAsDataURL(file);
                            }
                            return;
                        }
                        const text = cd.getData('text/plain') || '';
                        if (!text || text.indexOf('\t') === -1) return;
                        var rows = text.split(/\r?\n/).filter(function(r) { return r.length; });
                        if (rows.length === 0) return;
                        var cells = rows.map(function(row) { return row.split('\t'); });
                        var maxCols = Math.max.apply(null, cells.map(function(r) { return r.length; }));
                        var html = '<div class="guide-excel-table"><table><tbody>';
                        cells.forEach(function(row, rowIndex) {
                            html += '<tr>';
                            for (var i = 0; i < maxCols; i++) {
                                var cell = (row[i] || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                                var isHead = rowIndex === 0;
                                html += (isHead ? '<th>' : '<td>') + cell + (isHead ? '</th>' : '</td>');
                            }
                            html += '</tr>';
                        });
                        html += '</tbody></table></div>';
                        e.preventDefault();
                        quill.clipboard.dangerouslyPasteHTML(quill.getSelection(true).index, html);
                    });

                    editorRef.current = quill;
                }
            }, [guide]);

            const setEditorHtml = (html) => {
                const q = editorRef.current;
                if (!q || !q.root) return;
                lastExcelHtmlRef.current = null;
                q.focus();
                q.setSelection(0);
                q.deleteText(0, q.getLength());
                q.clipboard.dangerouslyPasteHTML(0, html || '<p><br></p>');
                setTimeout(function() { q.root.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
            };

            const handleFileUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const name = file.name.toLowerCase();

                if (name.endsWith('.docx')) {
                    try {
                        showToast('正在處理 Word 文件…', 'info');
                        const arrayBuffer = await file.arrayBuffer();
                        const opts = {
                            convertImage: window.mammoth.images.imgElement ? window.mammoth.images.imgElement(function(img) {
                                return img.read('base64').then(function(b64) {
                                    return { src: 'data:' + img.contentType + ';base64,' + b64 };
                                });
                            }) : undefined
                        };
                        const result = await window.mammoth.convertToHtml({ arrayBuffer }, opts);
                        const wrapped = '<div class="word-content">' + result.value + '</div>';
                        setTimeout(function() { setEditorHtml(wrapped); }, 0);
                        showToast('Word 已成功載入', 'success');
                        if (result.messages?.length) console.log('轉換訊息:', result.messages);
                    } catch (err) {
                        console.error(err);
                        showToast('Word 上傳失敗：' + (err.message || String(err)), 'error');
                    }
                } else if (name.endsWith('.pdf')) {
                    try {
                        showToast('正在處理 PDF（轉成圖片保留版面）…', 'info');
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        const numPages = Math.min(pdf.numPages, 30);
                        const scale = 2.5;
                        const imgHtml = [];
                        for (let i = 1; i <= numPages; i++) {
                            const page = await pdf.getPage(i);
                            const viewport = page.getViewport({ scale });
                            const canvas = document.createElement('canvas');
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;
                            const ctx = canvas.getContext('2d');
                            await page.render({ canvasContext: ctx, viewport }).promise;
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
                            imgHtml.push('<p class="pdf-page"><img src="' + dataUrl + '" alt="PDF 第' + i + '頁" style="max-width:100%;height:auto;display:block;margin:1em 0;" /></p>');
                        }
                        const html = imgHtml.join('');
                        setTimeout(function() { setEditorHtml(html); }, 0);
                        showToast('PDF 已成功載入（' + numPages + ' 頁，保留原樣）', 'success');
                    } catch (err) {
                        console.error(err);
                        showToast('PDF 上傳失敗：' + (err.message || String(err)), 'error');
                    }
                } else if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
                    try {
                        showToast('正在處理 Excel（轉成圖片保留表格）…', 'info');
                        const arrayBuffer = await file.arrayBuffer();
                        const wb = window.XLSX.read(arrayBuffer, { type: 'array' });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const tableHtml = window.XLSX.utils.sheet_to_html(ws, { id: 'xlsx-table', editable: false });
                        var q = editorRef.current;
                        if (!q || !q.root || !tableHtml) {
                            showToast('Excel 已成功載入（保留原樣）', 'success');
                            return;
                        }
                        var wrap = document.createElement('div');
                        wrap.style.cssText = 'position:fixed;left:-9999px;top:0;width:800px;padding:12px;background:#fff;font-size:14px;';
                        wrap.innerHTML = '<style>table{border-collapse:collapse;width:100%;} th,td{border:1px solid #ddd;padding:6px 10px;text-align:left;} th{background:#fef3c7;font-weight:700;}</style><div class="guide-excel-table">' + tableHtml + '</div>';
                        document.body.appendChild(wrap);
                        if (typeof html2canvas !== 'undefined') {
                            html2canvas(wrap, { scale: 2, useCORS: true, logging: false }).then(function(canvas) {
                                document.body.removeChild(wrap);
                                var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                                lastExcelHtmlRef.current = '<p class="pdf-page"><img src="' + dataUrl + '" alt="Excel 表格" style="max-width:100%;height:auto;display:block;margin:1em 0;" /></p>';
                                q.focus();
                                q.setSelection(0);
                                q.deleteText(0, q.getLength());
                                q.clipboard.dangerouslyPasteHTML(0, lastExcelHtmlRef.current);
                                setTimeout(function() { q.root.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
                                showToast('Excel 已成功載入（表格已轉為圖片）', 'success');
                            }).catch(function(e) {
                                document.body.removeChild(wrap);
                                var wrapped = '<div class="guide-excel-table">' + tableHtml + '</div>';
                                lastExcelHtmlRef.current = wrapped;
                                q.root.innerHTML = wrapped;
                                q.focus();
                                showToast('Excel 已成功載入（若未見表格請再試一次）', 'success');
                            });
                        } else {
                            document.body.removeChild(wrap);
                            var wrapped = '<div class="guide-excel-table">' + tableHtml + '</div>';
                            lastExcelHtmlRef.current = wrapped;
                            q.root.innerHTML = wrapped;
                            q.focus();
                            setTimeout(function() { q.root.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
                            showToast('Excel 已成功載入', 'success');
                        }
                    } catch (err) {
                        console.error(err);
                        showToast('Excel 上傳失敗：' + (err.message || String(err)), 'error');
                    }
                } else if (name.endsWith('.md')) {
                    try {
                        showToast('正在解析 Markdown 檔案…', 'info');
                        const text = await file.text();
                        if (typeof window.marked === 'undefined') {
                            showToast('Markdown 解析器尚未載入，請稍後再試', 'error');
                            event.target.value = '';
                            return;
                        }
                        const html = window.marked.parse(text);
                        const q = editorRef.current;
                        if (q && q.root) {
                            q.focus();
                            q.setSelection(0);
                            q.deleteText(0, q.getLength());
                            q.clipboard.dangerouslyPasteHTML(0, '<div class="md-content">' + html + '</div>');
                            setTimeout(() => q.root.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
                        } else {
                            setEditorHtml('<div class="md-content">' + html + '</div>');
                        }
                        showToast('Markdown 已成功載入', 'success');
                    } catch (err) {
                        console.error(err);
                        showToast('Markdown 上傳失敗：' + (err.message || String(err)), 'error');
                    }
                } else {
                    showToast('請上傳 .docx、.pdf、.xlsx、.xls 或 .md 格式', 'warning');
                }
                event.target.value = '';
            };

            const handleSave = async () => {
                if (!title.trim()) {
                    showToast('請輸入標題', 'warning');
                    return;
                }
                if (!editorRef.current || !quillRef.current) {
                    showToast('編輯器尚未就緒，請稍後再試', 'warning');
                    return;
                }
                let content = editorRef.current.root.innerHTML;
                if (lastExcelHtmlRef.current && !content.includes('<table')) {
                    content = lastExcelHtmlRef.current;
                }
                if (!content.trim() || content === '<p><br></p>') {
                    showToast('請輸入內容', 'warning');
                    return;
                }

                setSaving(true);

                try {
                    const guideData = {
                        title: title.trim(),
                        content,
                        category,
                        status,
                        is_pinned: isPinned,
                        author_id: currentUser.id,
                        author_name: authorName.trim() || '管理員'
                    };

                    if (guide) {
                        const { error } = await supabase
                            .from('guides')
                            .update(guideData)
                            .eq('id', guide.id);

                        if (error) throw error;
                        showToast(status === 'published' ? '更新成功' : '已儲存為草稿（前台不顯示）', 'success');
                    } else {
                        const { error } = await supabase
                            .from('guides')
                            .insert([guideData]);

                        if (error) throw error;
                        showToast(status === 'published' ? '新增成功，前台可見' : '已儲存為草稿（請改為「發布」後再儲存才會顯示）', status === 'draft' ? 'warning' : 'success');
                    }

                    onClose();
                } catch (error) {
                    console.error('儲存失敗:', error);
                    const code = error?.code || error?.status;
                    const msg = error?.message || error?.details || (typeof error === 'string' ? error : '');
                    if (code === 403 || code === '403' || (msg && String(msg).includes('403'))) {
                        showToast('權限不足 (403)，請確認已登入後台且具備攻略編輯權限', 'error');
                    } else if (code === '42501' || (msg && String(msg).includes('row-level security'))) {
                        showToast('權限不足：違反資料表權限政策。請執行 database/migrations/030_guides_rls_use_jwt_metadata.sql 並確認帳號 role 為 admin 或 super_admin 後重新登入', 'error');
                    } else {
                        showToast('儲存失敗：' + (msg || '請稍後再試'), 'error');
                    }
                } finally {
                    setSaving(false);
                }
            };

            return (
                <div className="bg-stone-900 rounded-2xl p-6 border border-stone-700">
                    <div className="flex items-center justify-between mb-6">
                        <h2 className="text-2xl font-black text-white">
                            {guide ? '編輯攻略' : '新增攻略'}
                        </h2>
                        <button
                            onClick={onClose}
                            className="text-stone-500 hover:text-stone-300"
                        >
                            <X size={24} />
                        </button>
                    </div>

                    <div className="space-y-6">
                        <div>
                            <label className="block text-stone-300 font-bold mb-2">標題 *</label>
                            <input
                                type="text"
                                value={title}
                                onChange={(e) => setTitle(e.target.value)}
                                placeholder="請輸入攻略標題"
                                className="w-full p-4 rounded-2xl bg-stone-800 border-2 border-stone-700 text-white placeholder-stone-500 focus:border-gold-400 focus:outline-none"
                            />
                        </div>

                        <div>
                            <label className="block text-stone-300 font-bold mb-2">作者暱稱 *</label>
                            <input
                                type="text"
                                value={authorName}
                                onChange={(e) => setAuthorName(e.target.value)}
                                placeholder="例如：管理員、自取、官方等"
                                className="w-full p-4 rounded-2xl bg-stone-800 border-2 border-stone-700 text-white placeholder-stone-500 focus:border-gold-400 focus:outline-none"
                            />
                            <p className="text-xs text-stone-500 mt-2">
                                💡 這個名稱會顯示在攻略頁面上
                            </p>
                        </div>

                        <div>
                            <label className="block text-stone-300 font-bold mb-2">分類 *</label>
                            <select
                                value={category}
                                onChange={(e) => setCategory(e.target.value)}
                                className="w-full p-4 rounded-2xl bg-stone-800 border-2 border-stone-700 text-white focus:border-gold-400 focus:outline-none"
                            >
                                {Object.entries(GUIDE_CATEGORIES).map(([id, c]) => (
                                    <option key={id} value={id}>{c.icon} {c.label}</option>
                                ))}
                            </select>
                        </div>

                        <div>
                            <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
                                <label className="block text-stone-300 font-bold w-full md:w-auto">內容 *</label>

                        <div className="flex gap-6">

                            <label className="flex items-center gap-2">

        // 管理員後台 - 攻略管理組件
        const GuideManagementTab = () => {
            const [guides, setGuides] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showEditor, setShowEditor] = useState(false);
            const [editingGuide, setEditingGuide] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [adminCatFilter, setAdminCatFilter] = useState('all');
            const [adminStatusFilter, setAdminStatusFilter] = useState('all');
            const [adminSearch, setAdminSearch] = useState('');

            useEffect(() => {
                loadCurrentUser();
                loadGuides();
            }, []);

            useEffect(() => {
                const handler = () => loadGuides();
                window.addEventListener('storage-update', handler);
                return () => window.removeEventListener('storage-update', handler);
            }, []);

            const loadCurrentUser = async () => {
                const user = await authHelpers.getCurrentUser();
                setCurrentUser(user);
            };

            const loadGuides = async () => {
                try {
                    const { data, error } = await supabase
                        .from('guides')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (error) throw error;
                    setGuides(data || []);
                } catch (error) {
                    console.error('載入攻略失敗:', error);
                    showToast('載入攻略失敗', 'error');
                } finally {
                    setLoading(false);
                }
            };

            const handleCreate = () => {
                setEditingGuide(null);
                setShowEditor(true);
            };

            const handleEdit = (guide) => {
                setEditingGuide(guide);
                setShowEditor(true);
            };

            const handleDelete = async (guideId) => {
                if (!confirm('確定要刪除這篇攻略嗎？')) return;

                try {
                    const { error } = await supabase
                        .from('guides')
                        .delete()
                        .eq('id', guideId);

                    if (error) throw error;

                    showToast('刪除成功', 'success');
                    loadGuides();
                } catch (error) {
                    console.error('刪除失敗:', error);
                    showToast('刪除失敗', 'error');
                }
            };

            const handleEditorClose = () => {
                setShowEditor(false);
                setEditingGuide(null);
                loadGuides();
            };

            const compressDataUrlImage = (dataUrl, maxW = 1200, quality = 0.82) => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => {
                        if (img.width <= maxW && dataUrl.length < 200000) return resolve(dataUrl);
                        const c = document.createElement('canvas');
                        const scale = Math.min(1, maxW / img.width);
                        c.width = Math.round(img.width * scale);
                        c.height = Math.round(img.height * scale);
                        const ctx = c.getContext('2d');
                        ctx.drawImage(img, 0, 0, c.width, c.height);
                        c.toBlob((b) => {
                            if (!b) return resolve(dataUrl);
                            const r = new FileReader();
                            r.onload = () => resolve(r.result);
                            r.readAsDataURL(b);
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = () => resolve(dataUrl);
                    img.src = dataUrl;
                });
            };

            const handleCompressAllGuides = async () => {
                if (!confirm('將批次壓縮所有攻略中的圖片，需時較久，確定繼續？')) return;
                showToast('開始壓縮攻略圖片...', 'info');
                let done = 0, updated = 0;
                for (const guide of guides) {
                    const html = guide.content || '';
                    const dataUrlRegex = /<img[^>]+src="(data:image\/[^"]+)"[^>]*>/gi;
                    let match;
                    const replacements = [];
                    while ((match = dataUrlRegex.exec(html)) !== null) {
                        const original = match[1];
                        if (original.length > 50000) {
                            try {
                                const compressed = await compressDataUrlImage(original);
                                if (compressed.length < original.length) replacements.push({ from: original, to: compressed });
                            } catch (e) { /* skip */ }
                        }
                    }
                    if (replacements.length > 0) {
                        let newContent = html;
                        replacements.forEach(r => { newContent = newContent.split(r.from).join(r.to); });
                        try {
                            const { error } = await supabase.from('guides').update({ content: newContent }).eq('id', guide.id);
                            if (!error) updated++;
                        } catch (e) { /* skip */ }
                    }
                    done++;
                    if (done % 2 === 0) showToast(`處理中 ${done}/${guides.length}...`, 'info');
                }
                showToast(`完成！共更新 ${updated} 篇攻略的圖片`, 'success');
                loadGuides();
            };

            if (showEditor) {
                return <GuideEditor guide={editingGuide} currentUser={currentUser} onClose={handleEditorClose} />;
            }

            const filteredAdminGuides = guides.filter(g => {
                if (adminCatFilter !== 'all' && g.category !== adminCatFilter) return false;
                if (adminStatusFilter !== 'all' && g.status !== adminStatusFilter) return false;
                if (adminSearch.trim()) {
                    const t = adminSearch.toLowerCase();
                    if (!(g.title || '').toLowerCase().includes(t) && !(g.author_name || '').toLowerCase().includes(t)) return false;
                }
                return true;
            });

            const publishedCount = guides.filter(g => g.status === 'published').length;
            const draftCount = guides.filter(g => g.status === 'draft').length;
            const pinnedCount = guides.filter(g => g.is_pinned).length;

            return (
                <div className="space-y-6">
                    {/* 標題列 */}
                    <div className="flex flex-wrap items-center justify-between gap-3">
                        <div>
                            <h2 className="text-2xl font-black text-white">活動攻略管理</h2>
                            <p className="text-stone-400 text-sm mt-1">共 {guides.length} 篇攻略 · 管理、編輯與發布</p>
                        </div>
                        <div className="flex gap-2 flex-wrap">
                            {guides.length > 0 && (
                                <button onClick={handleCompressAllGuides} className="px-4 py-2.5 rounded-xl bg-stone-700 hover:bg-stone-600 text-stone-300 font-bold text-sm border border-stone-600 transition-colors flex items-center gap-2" title="壓縮所有攻略中已上傳的圖片，減小載入體積">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                    壓縮圖片
                                </button>
                            )}
                            <Button onClick={handleCreate} variant="gold" icon={Plus}>
                                新增攻略
                            </Button>
                        </div>
                    </div>

                    {/* 統計卡片 */}
                    {!loading && guides.length > 0 && (
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                            {[
                                { label: '攻略總數', value: guides.length, icon: '📚' },
                                { label: '已發布',   value: publishedCount, icon: '✅' },
                                { label: '草稿',     value: draftCount,     icon: '📝' },
                                { label: '置頂',     value: pinnedCount,    icon: '📌' },
                            ].map(s => (
                                <div key={s.label} className="rounded-2xl bg-stone-800 border border-stone-700 px-5 py-4">
                                    <p className="text-stone-400 text-sm font-bold mb-1">{s.icon} {s.label}</p>
                                    <p className="text-3xl font-black text-white">{s.value}</p>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* 篩選列 */}
                    {!loading && guides.length > 0 && (
                        <div className="flex flex-wrap gap-3">
                            {/* 搜尋 */}
                            <div className="relative flex-1 min-w-[200px]">
                                <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-500" size={16} />
                                <input
                                    type="text"
                                    placeholder="搜尋標題、作者..."
                                    value={adminSearch}
                                    onChange={e => setAdminSearch(e.target.value)}
                                    className="w-full pl-9 pr-4 py-2.5 bg-stone-800 border border-stone-600 rounded-xl text-white text-sm placeholder-stone-500 focus:outline-none focus:border-amber-500 transition-colors"
                                />
                            </div>
                            {/* 狀態篩選 */}
                            <select
                                value={adminStatusFilter}
                                onChange={e => setAdminStatusFilter(e.target.value)}
                                className="px-3 py-2.5 bg-stone-800 border border-stone-600 rounded-xl text-stone-200 text-sm focus:outline-none focus:border-amber-500 transition-colors"
                            >
                                <option value="all">全部狀態</option>
                                <option value="published">已發布</option>
                                <option value="draft">草稿</option>
                                <option value="archived">已封存</option>
                            </select>
                            {/* 分類篩選 */}
                            <select
                                value={adminCatFilter}
                                onChange={e => setAdminCatFilter(e.target.value)}
                                className="px-3 py-2.5 bg-stone-800 border border-stone-600 rounded-xl text-stone-200 text-sm focus:outline-none focus:border-amber-500 transition-colors"
                            >
                                <option value="all">全部分類</option>
                                {Object.entries(GUIDE_CATEGORIES).map(([id, c]) => (
                                    <option key={id} value={id}>{c.icon} {c.label}</option>
                                ))}
                            </select>
                        </div>
                    )}

                    {loading ? (
                        <LoadingSpinner message="載入中..." />
                    ) : guides.length === 0 ? (
                        <div className="text-center py-20 bg-stone-800/50 rounded-2xl border border-stone-700">
                            <BookOpen size={48} className="mx-auto text-stone-600 mb-4" />
                            <p className="text-stone-400 font-bold text-lg">目前沒有攻略</p>
                            <p className="text-stone-500 text-sm mt-2">點擊「新增攻略」開始創作</p>
                        </div>
                    ) : filteredAdminGuides.length === 0 ? (
                        <div className="text-center py-12 bg-stone-800/50 rounded-2xl border border-stone-700">
                            <Search size={36} className="mx-auto text-stone-600 mb-3" />
                            <p className="text-stone-400 font-bold">沒有符合條件的攻略</p>
                        </div>
                    ) : (
                        <div className="space-y-3">
                            {filteredAdminGuides.map(guide => {
                                const catInfo = getGuideCategory(guide.category);
                                const statusLabel = guide.status === 'published' ? '✅ 已發布' : guide.status === 'draft' ? '📝 草稿' : '🗃️ 封存';
                                const statusCls = guide.status === 'published' ? 'bg-green-500/20 text-green-300' : guide.status === 'draft' ? 'bg-amber-500/20 text-amber-300' : 'bg-stone-600/40 text-stone-400';
                                return (
                                    <div key={guide.id} className="bg-stone-800 rounded-2xl border border-stone-700 hover:border-stone-500 transition-colors flex items-center gap-4 p-4">
                                        {/* 縮圖 */}
                                        <div className="w-16 h-16 shrink-0 rounded-xl overflow-hidden bg-stone-700 flex items-center justify-center">
                                            {guide.thumbnail

                                            }
                                        </div>
                                        {/* 內容 */}
                                        <div className="flex-1 min-w-0">
                                            <div className="flex items-center gap-2 mb-1.5 flex-wrap">
                                                <span className="text-sm text-stone-300 font-bold">{catInfo.icon} {catInfo.label}</span>
                                                <span className={`text-sm px-2.5 py-0.5 rounded-lg font-bold ${statusCls}`}>{statusLabel}</span>
                                                {guide.is_pinned && <span className="text-sm text-amber-400 font-bold">📌 置頂</span>}
                                            </div>
                                            <p className="text-white font-bold text-base line-clamp-1 mb-1">{guide.title}</p>
                                            <p className="text-stone-500 text-sm">{guide.author_name || '管理員'} · 👁 {guide.views || 0} · {new Date(guide.created_at).toLocaleDateString('zh-TW')}</p>
                                        </div>
                                        {/* 按鈕 */}
                                        <div className="flex items-center gap-2 shrink-0">
                                            <button onClick={() => handleEdit(guide)} className="px-4 py-2 bg-stone-700 hover:bg-stone-600 text-stone-200 rounded-xl text-sm font-bold transition-colors">編輯</button>
                                            <button onClick={() => handleDelete(guide.id)} className="px-4 py-2 bg-stone-700 hover:bg-red-900 text-stone-400 hover:text-red-300 rounded-xl text-sm font-bold transition-colors">刪除</button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        // 下載頁面
        const DownloadPage = () => {
            const handlePcDownload = () => {

                >

                    <div className="absolute inset-0 pointer-events-none" aria-hidden="true">
                        <div className="absolute -top-20 left-1/2 -translate-x-1/2 w-[min(100%,600px)] h-72 rounded-full bg-gold-400/25 blur-3xl" />
                        <div className="absolute bottom-1/3 right-0 w-80 h-80 rounded-full bg-water-400/15 blur-3xl" />
                        <div className="absolute bottom-1/4 left-0 w-64 h-64 rounded-full bg-earth-400/15 blur-3xl" />
                        <div className="absolute inset-0 opacity-[0.035]" style={{ backgroundImage: 'radial-gradient(circle at 1px 1px, #8b5a2b 1px, transparent 0)', backgroundSize: '20px 20px' }} />
                    </div>

                    {/* 標題區：主視覺 */}
                    <div className="max-w-3xl mx-auto text-center mb-12 md:mb-16 relative">
                        <motion.div
                            initial={{ scale: 0.9, opacity: 0 }}
                            animate={{ scale: 1, opacity: 1 }}
                            transition={{ delay: 0.08, type: 'spring', stiffness: 220 }}
                            className="inline-flex items-center justify-center w-20 h-20 md:w-24 md:h-24 bg-gradient-to-br from-gold-400 to-gold-600 rounded-2xl shadow-card mb-6 border-2 border-gold-500/40"
                        >
                            <Download size={40} className="text-white md:w-12 md:h-12" strokeWidth={2.5} />
                        </motion.div>
                        <h1 className="font-display text-4xl md:text-5xl lg:text-6xl font-black text-stone-800 mb-3 tracking-tight">遊戲下載</h1>
                        <p className="text-stone-600 font-medium text-base md:text-lg max-w-xl mx-auto">

                        <p className="text-stone-500 text-sm mt-4 flex items-center justify-center gap-2">
                            <span className="inline-block w-1.5 h-1.5 rounded-full bg-gold-500" /> 按鈕將於新分頁開啟下載
                        </p>
                    </div>

                    {/* 平台卡片 */}
                    <div className="max-w-5xl mx-auto relative">
                        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 md:gap-6">
                            {/* PC */}
                            <motion.div
                                whileHover={{ y: -6 }}
                                transition={{ type: 'spring', stiffness: 300 }}
                                className="group flex flex-col rounded-2xl overflow-hidden border-2 border-sand-400/60 bg-white shadow-card hover:shadow-xl hover:border-water-400/70 transition-all duration-300"
                            >
                                <div className="bg-gradient-to-br from-water-500 to-water-600 px-6 py-8 text-center relative">
                                    <div className="absolute inset-0 bg-[radial-gradient(ellipse_80%_50%_at_50%_0%,rgba(255,255,255,0.2),transparent)]" />
                                    <div className="relative w-16 h-16 mx-auto bg-white/95 rounded-xl flex items-center justify-center mb-3 shadow-lg">
                                        <svg className="w-9 h-9 text-water-600" fill="currentColor" viewBox="0 0 24 24"><path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-12.9-1.801"/></svg>
                                    </div>
                                    <h2 className="text-xl md:text-2xl font-black text-white">Windows PC</h2>

            useEffect(function initEventQuill() {
                if (currentTab !== 'events') return;
                var t = setTimeout(function() {
                    if (!eventQuillRef.current || eventEditorRef.current || !window.Quill) return;
                    var quill = new window.Quill(eventQuillRef.current, {
                        theme: 'snow',
                        modules: {
                            toolbar: [
                                [{ 'header': [1, 2, 3, false] }],
                                ['bold', 'italic', 'underline'],
                                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                                ['link', 'image'],
                                ['clean']
                            ]
                        },
                        placeholder: '活動內容… 可從 Word 貼上或使用下方上傳'
                    });
                    var compressAndInsert = function(file) {
                        var maxW = 960, quality = 0.75;
                        var compressBlob = function(blob) {
                            return new Promise(function(resolve) {
                                var img = new Image();
                                var url = URL.createObjectURL(blob);
                                img.onload = function() {
                                    URL.revokeObjectURL(url);
                                    if (img.width <= maxW && blob.size < 180000) return resolve(blob);
                                    var c = document.createElement('canvas');
                                    var scale = Math.min(1, maxW / img.width);
                                    c.width = Math.round(img.width * scale);
                                    c.height = Math.round(img.height * scale);
                                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                                    c.toBlob(function(b) { resolve(b || blob); }, 'image/jpeg', quality);
                                };
                                img.onerror = function() { URL.revokeObjectURL(url); resolve(blob); };
                                img.src = url;
                            });
                        };
                        compressBlob(file).then(function(compressed) {
                            var r = new FileReader();
                            r.onload = function(e) {
                                var idx = quill.getSelection(true);
                                quill.insertEmbed(idx ? idx.index : quill.getLength(), 'image', e.target.result);
                            };
                            r.readAsDataURL(compressed);
                        }).catch(function() {
                            var r = new FileReader();
                            r.onload = function(e) {
                                var idx = quill.getSelection(true);
                                quill.insertEmbed(idx ? idx.index : quill.getLength(), 'image', e.target.result);
                            };
                            r.readAsDataURL(file);
                        });
                    };
                    quill.getModule('toolbar').addHandler('image', function() {
                        var input = document.createElement('input');
                        input.type = 'file';
                        input.accept = 'image/*';
                        input.onchange = function() {
                            var f = input.files[0];
                            if (f) compressAndInsert(f);
                        };
                        input.click();
                    });
                    quill.root.addEventListener('paste', function(e) {
                        var cd = e.clipboardData;
                        if (!cd) return;
                        for (var i = 0; i < cd.items.length; i++) {
                            if (cd.items[i].type.indexOf('image') !== 0) continue;
                            e.preventDefault();
                            var f = cd.items[i].getAsFile();
                            if (f) compressAndInsert(f);
                            return;
                        }
                    });
                    quill.root.addEventListener('drop', function(e) {
                        var f = e.dataTransfer?.files?.[0];
                        if (f && f.type.indexOf('image') === 0) {
                            e.preventDefault();
                            compressAndInsert(f);
                        }
                    });
                    quill.root.addEventListener('dragover', function(e) {
                        if (e.dataTransfer?.types?.includes('Files')) e.preventDefault();
                    });
                    eventEditorRef.current = quill;
                    if (eventContent) quill.root.innerHTML = eventContent;
                }, 150);
                return function() { clearTimeout(t); };
            }, [currentTab]);

            const compressEventDataUrlImage = (dataUrl, maxW = 960, quality = 0.75) => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => {
                        if (img.width <= maxW && dataUrl.length < 150000) return resolve(dataUrl);
                        const c = document.createElement('canvas');
                        const scale = Math.min(1, maxW / img.width);
                        c.width = Math.round(img.width * scale);
                        c.height = Math.round(img.height * scale);
                        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                        c.toBlob((b) => {
                            if (!b) return resolve(dataUrl);
                            const r = new FileReader();
                            r.onload = () => resolve(r.result);

                        }, 'image/jpeg', quality);

                    img.onerror = () => resolve(dataUrl);

            const handleCompressAllEvents = async () => {
                if (!confirm('將批次壓縮所有活動中的圖片，需時較久，確定繼續？')) return;
                showToast('開始壓縮活動圖片...', 'info');
                let done = 0, updated = 0;
                for (const ev of events) {
                    const html = ev.content || '';
                    const dataUrlRegex = /<img[^>]+src="(data:image\/[^"]+)"[^>]*>/gi;
                    let match;
                    const replacements = [];
                    while ((match = dataUrlRegex.exec(html)) !== null) {
                        const original = match[1];
                        if (original.length > 40000) {
                            try {
                                const compressed = await compressEventDataUrlImage(original);
                                if (compressed.length < original.length) replacements.push({ from: original, to: compressed });
                            } catch (e) { /* skip */ }
                        }
                    }
                    if (replacements.length > 0) {
                        let newContent = html;
                        replacements.forEach(r => { newContent = newContent.split(r.from).join(r.to); });
                        try {
                            const { error } = await supabase.from(DB_TABLES.EVENTS).update({ content: newContent }).eq('id', ev.id);
                            if (!error) updated++;
                        } catch (e) { /* skip */ }
                    }
                    done++;
                    if (done % 2 === 0) showToast(`處理中 ${done}/${events.length}...`, 'info');
                }
                showToast(`完成！共更新 ${updated} 篇活動的圖片`, 'success');
                await refreshEvents();
                window.dispatchEvent(new Event('storage-update'));
            };

                        vb = new Date(b.created_at).getTime();
                        return dir * (va - vb);

                    if (userSortBy === 'email') {
                        va = (a.email || '').toLowerCase();
                        vb = (b.email || '').toLowerCase();
                        return dir * (va < vb ? -1 : va > vb ? 1 : 0);

                    if (userSortBy === 'cumulative') {
                        va = getCumulative(a);
                        vb = getCumulative(b);
                        return dir * (va - vb);
                    }
                    if (userSortBy === 'role') {
                        va = roleOrder(a.role);
                        vb = roleOrder(b.role);

                const SEVEN_DAYS = 7 * 24 * 60 * 60 * 1000;

            const fetchPopupEvents = () => getSupabaseData(DB_TABLES.EVENTS, { columns: POPUP_EVENTS_COLUMNS, limit: 20 })

                    const visible = (loaded || []).filter((e) => e.show_in_popup !== false);
